version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gallery_vault_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Gallery Vault
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGO_URI=mongodb://mongodb:27017/gallery_vault
      - JWT_SECRET_KEY=super_secret_jwt_access_key_change_in_prod_32bytes
      - JWT_REFRESH_SECRET_KEY=super_secret_jwt_refresh_key_change_in_prod_32bytes
      - TELEGRAM_API_ID=123456
      - TELEGRAM_API_HASH=your_telegram_api_hash
      - TELEGRAM_BOT_TOKEN=your_bot_token
      - TELEGRAM_CHANNEL_ID=-1001234567890
      - BREVO_API_KEY=xkeysib-your-brevo-api-key
      - BREVO_SENDER_EMAIL=send@mohinbd.com
      - BREVO_SENDER_NAME=Gallery Vault
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:7.0
    container_name: gallery_vault_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
