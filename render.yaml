services:
  - type: web
    name: gallery-vault-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOG_LEVEL
        value: INFO
      - key: APP_BASE_URL
        value: https://gallery-vault-api.onrender.com
      - key: MONGODB_DB_NAME
        value: gallery_vault
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BREVO_API_BASE_URL
        value: https://api.brevo.com/v3
      - key: BREVO_SENDER_EMAIL
        value: send@mohinbd.com
      - key: BREVO_SENDER_NAME
        value: Gallery Vault
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: 100/minute
      - key: RATE_LIMIT_AUTH
        value: 5/minute
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TELEGRAM_STORAGE_CHANNEL_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
